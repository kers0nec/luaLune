server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /login { try_files "" /index.html; }
    location = /tos { try_files "" /index.html; }
    location = /bot { try_files "" /index.html; }
    location ^~ /dashboard { try_files "" /index.html; }
    location = /admin { try_files "" /index.html; }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}